name: Assignment 6 Pipeline

on:
  push:
    branches:
      - "**"

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff

      - name: Run lightweight linter
        run: |
          if [ -d . ]; then
            ruff check .
          fi

  train:
    runs-on: ubuntu-latest
    needs: linter
    if: >
      needs.linter.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[run-train]')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run training (expensive job)
        run: |
          echo "Starting expensive training job..."
          # Replace with your real training command, e.g.:
          # python train.py
          python -c "print('Training placeholder completed successfully')"

      - name: Capture error logs on failure
        if: failure()
        run: |
          echo "Training failed on commit: ${{ github.sha }}" > error_logs.txt
          echo "Branch: ${{ github.ref }}" >> error_logs.txt
          echo "Please inspect training command output in this workflow run." >> error_logs.txt

      - name: Upload failure logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: training-error-logs
          path: error_logs.txt

      - name: Cleanup resources
        if: always()
        run: echo "Cleaning up temporary cloud volumes..."
